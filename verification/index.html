<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design System Test</title>
    <link rel="stylesheet" href="../assets/base.css">
    <style>
        /* Minimal simulation of theme structure */
        body { padding: 50px; }
        .grid { display: flex; gap: 20px; }
    </style>
</head>
<body>
    <h1>Heading 1 - Tenor Sans</h1>
    <h2>Heading 2 - Tenor Sans</h2>
    <p>This is a paragraph body text. It should be in Assistant font and have a line-height of 1.6. The background of the page should be #F6F6F4 and the text color should be #1C1C1C.</p>

    <div class="grid">
        <a href="#" class="button">Primary Button</a>
        <a href="#" class="button button--secondary">Secondary Button</a>
    </div>

    <div class="gradient" style="padding: 20px; margin-top: 20px;">
        <p>Text inside .gradient container</p>
    </div>
</body>
</html>
